<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Left half of diamond - white -->
  <path d="M16 2 L2 16 L16 30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right half of diamond - TON blue -->
  <path d="M16 2 L30 16 L16 30" fill="none" stroke="#0098EA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chain link - top (white/left) -->
  <rect x="14.25" y="10.25" width="3.5" height="5.75" rx="1.75" fill="none" stroke="#FFFFFF" stroke-width="0.75"/>
  <!-- Chain link - bottom (blue/right) -->
  <rect x="14.25" y="16" width="3.5" height="5.75" rx="1.75" fill="none" stroke="#0098EA" stroke-width="0.75"/>

  <!-- Left circuit traces with terminals -->
  <circle cx="6.5" cy="9" r="1" fill="#FFFFFF"/>
  <line x1="7.5" y1="9" x2="12" y2="11" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round"/>

  <circle cx="4.5" cy="16" r="1" fill="#FFFFFF"/>
  <line x1="5.5" y1="16" x2="12" y2="16" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round"/>

  <circle cx="6.5" cy="23" r="1" fill="#FFFFFF"/>
  <line x1="7.5" y1="23" x2="12" y2="21" stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round"/>

  <!-- Right circuit traces with terminals -->
  <circle cx="25.5" cy="9" r="1" fill="#0098EA"/>
  <line x1="24.5" y1="9" x2="20" y2="11" stroke="#0098EA" stroke-width="0.6" stroke-linecap="round"/>

  <circle cx="27.5" cy="16" r="1" fill="#0098EA"/>
  <line x1="26.5" y1="16" x2="20" y2="16" stroke="#0098EA" stroke-width="0.6" stroke-linecap="round"/>

  <circle cx="25.5" cy="23" r="1" fill="#0098EA"/>
  <line x1="24.5" y1="23" x2="20" y2="21" stroke="#0098EA" stroke-width="0.6" stroke-linecap="round"/>
</svg>